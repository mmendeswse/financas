<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070D14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="manifest" href="manifest.json?v=4">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png?v=4">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png?v=4">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png?v=4">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon-precomposed.png?v=4">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png?v=4">
<meta name="color-scheme" content="dark">
<title>Muller Mendes — Gerenciamento de Finanças Pessoais</title>
<link rel="stylesheet" href="css/style.css?v=1.5.0">
</head>
<body>

<div class="shell">

  <div class="scrim-menu" id="scrimMenu"></div>

  <aside class="sidebar" id="sidebar">
    <button class="logo" id="btnLogo" title="Ir para o Dashboard" data-secao="dashboard">
      <div class="logo-mark"><svg viewBox="0 0 48 48" fill="none" stroke="none"><rect x="9" y="27" width="6" height="13" rx="1.5" fill="currentColor"/><rect x="18" y="21" width="6" height="19" rx="1.5" fill="currentColor"/><rect x="27" y="17" width="6" height="23" rx="1.5" fill="currentColor"/><rect x="36" y="11" width="6" height="29" rx="1.5" fill="currentColor"/><path d="M9 23 L20 16 L29 12 L40 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".65"/><circle cx="9" cy="23" r="2.4" fill="currentColor"/><circle cx="20" cy="16" r="2.4" fill="currentColor"/><circle cx="29" cy="12" r="2.4" fill="currentColor"/><circle cx="40" cy="6" r="2.4" fill="currentColor"/></svg></div>
      <div class="logo-txt"><b>Muller Mendes</b><span>Finanças pessoais</span></div>
    </button>

    <nav class="nav" id="navPrincipal">
      <button data-secao="dashboard"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="6" height="6" rx="1.2"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.2"/><rect x="2.5" y="11.5" width="6" height="6" rx="1.2"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.2"/></svg>Dashboard</button>
      <button data-secao="bancos"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l7-4 7 4"/><path d="M4 8h12v1H4z"/><path d="M5 9v6M9 9v6M13 9v6"/><path d="M3 16h14"/></svg>Bancos</button>
      <button data-secao="entradas"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15V6M6 10l4-4 4 4"/><path d="M4 16h12"/></svg>Entradas</button>
      <button data-secao="despesas"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5v9M6 10l4 4 4-4"/><path d="M4 16h12"/></svg>Despesas</button>
      <button data-secao="investimentos"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l4.5-4.5L11 12l6-6"/><path d="M13 6h4v4"/></svg>Investimentos</button>
      <button data-secao="acoes"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3" width="15" height="14" rx="1.5"/><path d="M5 13l2.5-3 2 2 3.5-4.5" /><circle cx="5" cy="7" r=".7" fill="currentColor" stroke="none"/></svg>Ações</button>
      <button data-secao="relatorios"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15V9M10 15V5M15 15v-6"/><path d="M3 17h14"/></svg>Relatórios</button>
      <button data-secao="metas"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6.5"/><circle cx="10" cy="10" r="3"/><circle cx="10" cy="10" r=".6" fill="currentColor" stroke="none"/></svg>Metas</button>
      <div class="nav-sep"></div>
      <button data-secao="configuracoes"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2.6"/><path d="M10 3v2M10 15v2M3 10h2M15 10h2M5 5l1.4 1.4M13.6 13.6L15 15M15 5l-1.4 1.4M6.4 13.6L5 15"/></svg>Configurações</button>
    </nav>
    <div class="nav-ferramentas">
        <div class="status-vivo" id="statusVivo" title="Data e hora locais"><span class="dot-vivo"></span><span id="dataTopbar" class="data-topbar"></span><span id="relogioTopbar">--:--:--</span></div>
        <button class="icon-btn" id="btnNotificacoes" aria-label="Notificações" title="Notificações">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a4 4 0 0 1 8 0c0 3.5 1.2 4.5 1.2 4.5H4.8S6 11.5 6 8z"/><path d="M8.3 15a1.8 1.8 0 0 0 3.4 0"/></svg>
          <span class="bolinha" id="badgeNotificacoes" style="display:none">0</span>
        </button>
        <div class="dropdown" id="dropdownNotificacoes"></div>
    </div>

    <div class="sidebar-meta" id="sidebarMeta"></div>
    <div class="sidebar-rodape">100% local · seus dados não saem do navegador</div>
  </aside>

  <div class="main">
    <div style="display:none"><h1 id="tituloSecao"></h1><div id="subtituloSecao"></div></div>

    <div class="ticker-tape" id="tickerTape" style="display:none">
      <div class="ticker-track" id="tickerTrack"></div>
    </div>

    <div class="scroll">
      <div id="conteudo"></div>
      <div class="rodape-app"><span id="rodapeAtualizado"></span><span>Armazenamento local · nenhum dado sai do navegador</span><span>Muller Mendes v1.0</span></div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<input type="file" id="inputImportarPdf" accept=".pdf,application/pdf" style="display:none">
<input type="file" id="inputImportarBackup" accept="application/json" style="display:none">

<!-- bibliotecas de terceiros (offline, incluídas no projeto) -->
<script src="js/vendor/chart.umd.min.js"></script>

<!-- módulos do sistema — ordem importa: cada um usa o anterior -->
<script src="js/bloqueio.js?v=1.5.0"></script>
<script src="js/armazenamento.js?v=1.5.0"></script>
<script src="js/financeiro.js?v=1.5.0"></script>
<script src="js/investimentos.js?v=1.5.0"></script>
<script src="js/graficos.js?v=1.5.0"></script>
<script src="js/extrato.js?v=1.5.0"></script>
<script src="js/cotacoes.js?v=1.5.0"></script>
<script src="js/sincronizacao.js?v=1.5.0"></script>
<script src="js/app.js?v=1.5.0"></script>
<script>
  // registra o service worker (só funciona via http/https — no iPad, depois de publicado)
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
</script>
</body>
</html>
